# Hiro Chainhooks v2 Configuration
# 2026 Protocol Standards
version: 2
name: stacks-defi-indexer
chain: stacks
networks:
  mainnet:
    # Start scanning from the current tip or a specific block
    if_this:
      scope: contract_call
      contract_identifier: "SPXXXX.defi-vault"
      # We combine predicates for better performance in v2
      any:
        - method: "deposit"
        - method: "withdraw"
    then_that:
      http_post:
        url: "https://YOUR_BACKEND_URL/webhook/stacks-event"
        authorization: "Bearer ${API_KEY}" # Injected from your .env
        # v2 includes reorg_protocol for automated rollback handling
        reorg_protocol: true 

  # Separate hook for FT events (Fungible Tokens)
  # v2 handles asset_identifiers with higher precision
  - name: token-monitor
    if_this:
      scope: ft_event
      asset_identifier: "SPXXXX.token::defi-token"
      actions: ["transfer", "mint", "burn"]
    then_that:
      http_post:
        url: "https://YOUR_BACKEND_URL/webhook/token"
        authorization: "Bearer ${API_KEY}"
